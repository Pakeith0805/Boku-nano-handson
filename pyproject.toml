[project]
name = "boku-nano"
version = "0.1.0"
description = "日本語の指示から限定的なPython関数を生成するSLMを、データ生成から評価までフルスクラッチで作る実習プロジェクト"
requires-python = ">=3.12"
# 依存の層は実装計画 §11 を参照。
#   boku/semantics, boku/interp, boku/probes  … 標準ライブラリのみ
#   scripts/                                  … ＋ hydra-core, mlflow, tokenizers
#   tests/                                    … ＋ pytest
# 意味の権威（参照インタプリタ・レジストリ）に外部ライブラリを持ち込まない。
# 境界は tests/test_core_has_no_external_deps.py で固定する。
dependencies = [
    "hydra-core>=1.3",
    "mlflow>=2.16",
    "tokenizers>=0.22",  # scripts/build_tokenizer.py がBPE学習に使う。teacherグループ無しでも要る
]

[dependency-groups]
dev = ["pytest>=8"]

# 教師モデル（Qwen/Qwen3-4B-AWQ）の推論スタック（document_EXPAND.md §2.7、RUNBOOK 16a）。
#
# **既定では入れない。** `uv sync --group teacher` で明示的に入れる。
# 用途は「24opぶんのプロンプトを1回ずつ、非thinkingモードで流す」だけでスループットは要らない。
# そのため vLLM ではなく transformers を使う（依存が軽く、挙動が追いやすい）。
#
# 教師モデルを触るコードは scripts/teacher/ に閉じる。boku/ からは絶対に import しない
# （tests/test_core_has_no_external_deps.py の境界は変更しない）。
# AWQ の読み込みには gptqmodel が要る（transformers 5.x が autoawq から移行した）。
# **バックエンドに BACKEND.TORCH を明示すること。** 既定の自動選択は AwqMarlinLinear を選び、
# その JIT ビルドが CUDA_HOME（nvcc）を要求して失敗する。本環境に CUDA toolkit は無い。
# torchvision は gptqmodel が import するため必要（画像は使わない）。
teacher = [
    "torch>=2.9",          # RTX 5090 = compute capability 12.0 (sm_120) を含むビルドが要る
    "transformers>=4.51",  # Qwen3 対応
    "accelerate>=1.0",
    "huggingface-hub>=0.34",
    "gptqmodel>=7.3",      # AWQ 読み込み。BACKEND.TORCH で使う
    "torchvision",         # gptqmodel の import 依存
    "pyyaml>=6",           # scripts/teacher/op_seeds.yaml を読む
]

[tool.pytest.ini_options]
# インストールせずリポジトリのルートから実行する。`boku` を import できるようにする。
pythonpath = ["."]
testpaths = ["tests"]
