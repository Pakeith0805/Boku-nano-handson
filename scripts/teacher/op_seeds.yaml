# 24opの言い回しを教師モデル（Qwen）に増やさせるための「種」。
#
# ここは**人間が書く資産**であり、生成物ではない。教師モデルにopの意味を推測させると必ず
# ズレる（`reverse`と`desc`、`every_other`の「1個おき」など、`src/semantics/registry.py`の
# `notes`がまさにその曖昧性を潰している箇所）。意味の確定はこちらで行い、教師には
# 「同じ意味の別の言い方」だけを作らせる。
#
# `generate_phrases.py`がこのファイルを読んでプロンプトを組み立てる。
# `ops`のキー集合は`OP_REGISTRY`と完全一致していなければならない。

version: v1
# ↑ プロンプトの版。meaning/examples/forbid のいずれかを変えたら上げる。
#   生成した各行にこの版を記録し、どの種から出た表現かを後から辿れるようにする。

literal_probe: 7
# k参照opの生成に使う具体値。examples中の `{k}` はプロンプトを組むときにこの値へ展開し、
# 生成された行の中のこの値を `{k}` へ戻す。
#
# 7 なのは (1) 全10個のk参照opの literal_domain（最小でも mul_k の 4以上）に入る、
# (2) opに焼き付いた定数 2（double）・3（triple）・2乗（square）と衝突しない、
# (3) 日本語の慣用句（「一つ」「二度」など）に紛れ込みにくい、の3点による。
# 2 や 3 にすると double/triple/square の表現と区別がつかなくなるので変えないこと。

style:
  # 全opに共通する文型の制約。ここが崩れると後段で連結できなくなる。
  # プロンプトにそのまま並べる。フィルタでも一部を機械的に検査する。
  - 終止形の動詞句で書く（「〜する」「〜を残す」の形で終える）。体言止めにしない
  - 主語や「リスト」への言及を入れない（「リストから偶数を残す」ではなく「偶数だけを残す」）
  - 1行につき1つの言い方だけを書く。番号・記号・引用符・括弧書きを付けない
  - プログラムのコードや変数名（xs, k, lambda など）を書かない
  - 5文字以上40文字以内にする

ops:
  # ---- 抽出（filter, 10種類）----
  even:
    meaning: 偶数の要素だけを残し、奇数を捨てる
    examples:
      - 偶数だけを残す
      - 偶数のみを取り出す
    forbid: []

  odd:
    meaning: 奇数の要素だけを残し、偶数を捨てる
    examples:
      - 奇数だけを残す
      - 奇数のみを取り出す
    forbid: []

  gt:
    meaning: "{k}より大きい要素だけを残す。{k}ちょうどは残さない"
    examples:
      - "{k}より大きい要素だけを残す"
      - "{k}を超える値のみを取り出す"
    forbid: [以上]  # ge との混同。gt は {k} ちょうどを含まない

  ge:
    meaning: "{k}以上の要素だけを残す。{k}ちょうども残す"
    examples:
      - "{k}以上の要素だけを残す"
      - "{k}以上の値のみを取り出す"
    forbid: [より大きい, を超える]  # gt との混同

  lt:
    meaning: "{k}より小さい要素だけを残す。{k}ちょうどは残さない"
    examples:
      - "{k}より小さい要素だけを残す"
      - "{k}未満の値のみを取り出す"
    forbid: [以下]  # le との混同

  le:
    meaning: "{k}以下の要素だけを残す。{k}ちょうども残す"
    examples:
      - "{k}以下の要素だけを残す"
      - "{k}以下の値のみを取り出す"
    forbid: [より小さい, 未満]  # lt との混同

  multiple_of:
    meaning: "{k}で割り切れる要素だけを残す"
    examples:
      - "{k}の倍数だけを残す"
      - "{k}で割り切れる要素のみを取り出す"
    forbid: []

  positive:
    meaning: 0より大きい要素だけを残す。0は残さない
    examples:
      - 正の要素だけを残す
      - 0より大きい値のみを取り出す
    forbid: [0以上, ゼロ以上]  # 0を含めてしまう言い方は ge@1 であって positive ではない

  negative:
    meaning: 0より小さい要素だけを残す。0は残さない
    examples:
      - 負の要素だけを残す
      - 0より小さい値のみを取り出す
    forbid: [0以下, ゼロ以下]

  zero:
    meaning: 値が0の要素だけを残す
    examples:
      - 0の要素だけを残す
      - 値が0のものだけを取り出す
    forbid: []

  # ---- 変換（map, 8種類）----
  add_k:
    meaning: "各要素に{k}を足す。要素の個数も順序も変えない"
    examples:
      - "各要素に{k}を足す"
      - "すべての要素に{k}を加える"
    forbid: []

  sub_k:
    meaning: "各要素から{k}を引く。要素の個数も順序も変えない"
    examples:
      - "各要素から{k}を引く"
      - "すべての要素を{k}だけ小さくする"
    forbid: []

  mul_k:
    meaning: "各要素に{k}を掛ける。要素の個数も順序も変えない"
    examples:
      - "各要素を{k}倍する"
      - "すべての要素に{k}を掛ける"
    forbid: [乗]  # 「{k}乗」は累乗であって掛け算ではない

  double:
    meaning: 各要素を2倍する
    examples:
      - 各要素を2倍する
      - すべての要素に2を掛ける
    forbid: [2乗, 二乗, 平方]  # square との混同

  triple:
    meaning: 各要素を3倍する
    examples:
      - 各要素を3倍する
      - すべての要素に3を掛ける
    forbid: [3乗, 三乗, 立方]

  negate:
    meaning: 各要素の符号を反転する。正は負に、負は正になる
    examples:
      - 各要素の符号を反転する
      - すべての要素にマイナスを掛ける
    forbid: [絶対値, 逆順, 並び]  # abs・reverse との混同

  abs:
    meaning: 各要素を絶対値に置き換える。負の要素だけが正になる
    examples:
      - 各要素の絶対値を取る
      - すべての要素をその絶対値に置き換える
    forbid: [符号を反転, 符号を逆]  # negate との混同

  square:
    meaning: 各要素を2乗する（それ自身と掛け合わせる）
    examples:
      - 各要素を2乗する
      - すべての要素をそれ自身と掛け合わせる
    forbid: [2倍, 二倍, 倍にする]  # double との混同

  # ---- 並べ替え（order, 3種類）----
  asc:
    meaning: 小さい順に並べ替える
    examples:
      - 小さい順に並べ替える
      - 昇順に並べ替える
    forbid: [逆順, 大きい順, 降順]  # desc・reverse との混同

  desc:
    meaning: 大きい順に並べ替える
    examples:
      - 大きい順に並べ替える
      - 降順に並べ替える
    forbid: [逆順, 小さい順, 昇順]

  reverse:
    meaning: 今の並び順をそのままひっくり返す。値の大小では並べ替えない
    examples:
      - 並び順を逆にする
      - 要素の順序を逆向きにする
    forbid: [並べ替え, ソート, 昇順, 降順, 大きい順, 小さい順]  # desc との混同。ここが最重要

  # ---- 切り出し（slice, 3種類）----
  take_first:
    meaning: "先頭から{k}個を取り出す。残りは捨てる"
    examples:
      - "先頭から{k}個を取り出す"
      - "最初の{k}個だけを残す"
    forbid: [末尾, 最後, 後ろ]  # take_last との混同

  take_last:
    meaning: "末尾から{k}個を取り出す。残りは捨てる"
    examples:
      - "末尾から{k}個を取り出す"
      - "最後の{k}個だけを残す"
    forbid: [先頭, 最初, 前]

  every_other:
    meaning: 先頭の要素から始めて1つ飛ばしに取り出す
    examples:
      - 先頭から1つおきに取り出す
      - 1つ飛ばしで要素を取り出す
    forbid: [偶数番目, 奇数番目]  # 数え方の起点が曖昧になる。位置ではなく「飛ばす」で表す
