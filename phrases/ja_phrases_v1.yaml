# 承認済み日本語表現辞書 v1
# 引き当てキーは OP_REGISTRY の ja_key。`{k}` は k 参照opのスロット。
# 各言い回しのキー（例: abs-01）は承認日時順の連番。新しい承認は必ず末尾に付くので、
# 再コンパイルしても既存の番号はズレない。集計・ログにはこの番号を使うこと。
# 生成物ではなく人間が承認した資産である。`scripts/review_phrases.py` で作るが、
# 中身を決めているのは判定した人間であり、流し直しても同じものは再現されない。
# registry_version: ops24-v1

